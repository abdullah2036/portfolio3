              <button class="btn btn-primary" type="submit" data-magnetic><svg class="ic" aria-hidden="true"><use href="#i-chat"/></svg><span data-k="contact.your.send"></span></button>
              <a class="btn btn-ghost" id="ideaEmail" href="#"><svg class="ic" aria-hidden="true"><use href="#i-mail"/></svg><span data-k="contact.your.email"></span></a>
            </div>

        </div>
        <div data-for="my" class="contact-grid">

            <h2 class="display-2" data-split data-k="contact.my.title"></h2>

          </div>
          <ul class="links" data-reveal>
            <li><a class="link-row glass" id="lnGithub" target="_blank" rel="noopener" data-spot>
              <svg class="ic ic-lg" aria-hidden="true"><use href="#i-github"/></svg>
              <span class="lr-text"><span class="lr-t" data-k="contact.my.links.github"></span><span class="lr-n" data-k="contact.my.links.githubNote"></span></span>
              <svg class="ic lr-arrow" aria-hidden="true"><use href="#i-out"/></svg></a></li>
            <li><a class="link-row glass" id="lnLinkedin" target="_blank" rel="noopener" data-spot>
              <svg class="ic ic-lg" aria-hidden="true"><use href="#i-linkedin"/></svg>
              <span class="lr-text"><span class="lr-t" data-k="contact.my.links.linkedin"></span><span class="lr-n" data-k="contact.my.links.linkedinNote"></span></span>
              <svg class="ic lr-arrow" aria-hidden="true"><use href="#i-out"/></svg></a></li>
            <li><a class="link-row glass" id="lnEmail" data-spot>
              <svg class="ic ic-lg" aria-hidden="true"><use href="#i-mail"/></svg>
              <span class="lr-text"><span class="lr-t" data-k="contact.my.links.email"></span><span class="lr-n" data-k="contact.my.links.emailNote"></span></span>
              <svg class="ic lr-arrow" aria-hidden="true"><use href="#i-out"/></svg></a></li>
          </ul>
        </div>
      </div>
    </div>
  </section>
